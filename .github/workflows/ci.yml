name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore sherpa-onnx libs and models
        uses: actions/cache@v5
        with:
          path: |
            third_party/sherpa-onnx
            extraResources/diarization-models
          key: sherpa-${{ hashFiles('scripts/fetch-sherpa.sh') }}
      - name: Fetch sherpa-onnx libs and models
        run: bash scripts/fetch-sherpa.sh
      - name: Generate Xcode project
        run: cd Plume && xcodegen generate
      - name: Build Plume
        run: |
          cd Plume
          xcodebuild -project Plume.xcodeproj -scheme Plume \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES \
            build
      - name: Unit tests
        run: bash scripts/test-plume.sh

  # Builds the DMG on every push to main (downloadable from the run's
  # Artifacts) and on v* tags, where it is also attached to a GitHub Release.
  # With the Developer ID secrets in the "release" environment it is signed and
  # notarized; without them it is an unsigned (ad-hoc) build.
  package:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore sherpa-onnx libs and models
        uses: actions/cache@v5
        with:
          path: |
            third_party/sherpa-onnx
            extraResources/diarization-models
          key: sherpa-${{ hashFiles('scripts/fetch-sherpa.sh') }}
      - name: Fetch sherpa-onnx libs and models
        run: bash scripts/fetch-sherpa.sh
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "value=$v" >> "$GITHUB_OUTPUT"
            echo "marketing=${v%%-*}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "marketing=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [[ -n "$CERT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set; building an unsigned DMG."
          fi
      - name: Import Developer ID certificate
        id: cert
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/plume-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity found in the certificate."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
      - name: Build DMG
        env:
          PLUME_VERSION: ${{ steps.version.outputs.value }}
          PLUME_MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          PLUME_BUILD_NUMBER: ${{ github.run_number }}
          PLUME_RELEASE_SIGNING: ${{ steps.signing.outputs.enabled == 'true' && '1' || '0' }}
          PLUME_CODE_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: bash scripts/package-plume-dmg.sh Release
      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/notarize-dmg.sh dist/*.dmg
      - name: Remove signing keychain
        if: always() && steps.cert.outputs.keychain != ''
        run: security delete-keychain "${{ steps.cert.outputs.keychain }}" || true
      - uses: actions/upload-artifact@v6
        with:
          name: Plume-${{ steps.version.outputs.value }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - name: Add the permanent download name
        if: startsWith(github.ref, 'refs/tags/v')
        # The stapled notarization ticket travels with the file, so the copy is just as valid.
        run: cp dist/Plume-*.dmg dist/Plume.dmg
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          generate_release_notes: true
